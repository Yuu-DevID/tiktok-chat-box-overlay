[package]
name = "tiktok-live-reader"
version = "0.2.0"
edition = "2021"
description = "TikTok LIVE reader, song requests and OBS overlays as one Rust app"
license = "AGPL-3.0-only"

[dependencies]
tiktok-live-connector = { git = "https://github.com/simnJS/tiktok-live-connector-rs", rev = "0f6fc57c30d06f69ee9610bb6adb4a02edf93fc9" }

axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
fancy-regex = "0.16"
mime_guess = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "deflate", "json", "stream"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
wry = "0.57"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
