<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Session Summary</title>
<link rel="stylesheet" href="/widgets/summary/summary.css" />
<link rel="stylesheet" href="/widgets/shared/overlay-theme.css" />
</head>
<body>
  <div id="card">
    <div id="title-row"><span id="title">This session</span></div>
    <div id="stats">
      <div class="stat">
        <span class="stat-label">Comments</span>
        <span class="stat-value" id="stat-comments">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Gifts</span>
        <span class="stat-value" id="stat-gifts">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Active viewers</span>
        <span class="stat-value" id="stat-viewers">0</span>
      </div>
      <div class="stat" id="top-gifter-row">
        <span class="stat-label">Top gifter</span>
        <span class="stat-value" id="stat-top-gifter">—</span>
      </div>
    </div>
    <div id="empty">Waiting for “Show summary” in the panel…</div>
  </div>

  <script src="/widgets/shared/shared.js"></script>
  <script src="/widgets/summary/summary.js"></script>
</body>
</html>
