<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>TikTok Chat</title>
<link rel="stylesheet" href="/widgets/chatbox/chatbox.css" />
</head>
<body>
  <header id="topbar" data-drag-region="true">
    <div class="brand">
      <span id="conn-dot" class="conn-dot"></span>
      <span id="conn-label">Connecting…</span>
    </div>
    <div class="counters">
      <span title="Comments">💬 <b id="c-comments">0</b></span>
      <span title="Gifts">🎁 <b id="c-gifts">0</b></span>
      <span title="Viewers">👥 <b id="c-viewers">0</b></span>
    </div>
  </header>

  <div id="pin-bar">
    <span class="pin-icon">📌</span>
    <div class="pin-text"><b id="pin-nick"></b><span id="pin-comment"></span></div>
    <button type="button" id="pin-clear" title="Unpin">✕</button>
  </div>

  <div id="toolbar">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
      </svg>
      <input id="search" type="text" placeholder="Filter chat…" autocomplete="off" />
    </div>
    <label class="pin-auto" title="Auto-unpin after">
      <span>⏱</span>
      <select id="pin-auto">
        <option value="0">off</option>
        <option value="15000">15s</option>
        <option value="30000" selected>30s</option>
        <option value="60000">60s</option>
      </select>
    </label>
    <button type="button" id="jump" title="Jump to newest">↓</button>
  </div>

  <main id="feed-wrap">
    <div id="feed"></div>
    <div id="empty">
      <span>Waiting for chat…</span>
      <span class="hint">Start the server with <code>npm start</code></span>
    </div>
    <div id="toast" role="status"></div>
  </main>

  <footer id="dock">
    <div id="now-row">
      <span class="np-icon" id="np-icon">▶</span>
      <span id="np-title">Nothing playing</span>
      <span id="np-by"></span>
      <span class="np-hint" id="np-hint">m!p &lt;song&gt;</span>
    </div>

    <div id="timer-row">
      <span id="timer-clock">05:00</span>
      <span class="timer-label">BRB</span>
      <div class="timer-btns">
        <button type="button" data-timer="300000">5m</button>
        <button type="button" data-timer="600000">10m</button>
        <button type="button" id="timer-stop">Stop</button>
      </div>
    </div>

    <div id="controls">
      <button type="button" class="toggle" id="tts-toggle" data-on="true" title="Read new comments aloud">🔊 Voice</button>
      <select id="tts-lang" title="Spoken language">
        <option value="en">EN</option>
        <option value="id">ID</option>
        <option value="th">TH</option>
      </select>
      <button type="button" class="toggle" id="req-toggle" data-on="false" title="Accept m!p song requests">🎵 Requests</button>
      <button type="button" class="toggle" id="auto-toggle" data-on="true" title="Play accepted requests immediately">⚡ Auto</button>
    </div>
  </footer>

  <script src="/widgets/shared/shared.js"></script>
  <script src="/widgets/chatbox/chatbox.js"></script>
</body>
</html>
